<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Milk Management record history cover</title><desc id="d">Branded illustration of daily milk records and date filtering</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#edf8f2"/><stop offset="1" stop-color="#cfe6d8"/></linearGradient></defs><rect width="1600" height="900" rx="44" fill="url(#b)"/><circle cx="1450" cy="0" r="420" fill="#fff" opacity=".65"/><text x="105" y="130" fill="#287057" font-family="Arial" font-size="28" font-weight="700" letter-spacing="8">MILK MANAGEMENT · FEATURE COVER</text><text x="105" y="270" fill="#12291f" font-family="Arial" font-size="88" font-weight="800">DAILY RECORDS.</text><text x="110" y="340" fill="#526b60" font-family="Arial" font-size="34">History by day, quantity, rate and amount.</text><g transform="translate(110 430)" font-family="Arial"><rect width="1380" height="350" rx="34" fill="#fff"/><g fill="#687c73" font-size="20" font-weight="700"><text x="48" y="62">DATE</text><text x="430" y="62">QUANTITY</text><text x="760" y="62">RATE</text><text x="1070" y="62">AMOUNT</text></g><path d="M45 88h1290M45 170h1290M45 252h1290" stroke="#dce9e1" stroke-width="2"/><g fill="#183327" font-size="25"><text x="48" y="140">TODAY</text><text x="430" y="140">RECORDED</text><text x="760" y="140">UPDATED</text><text x="1070" y="140">CALCULATED</text><text x="48" y="222">PREVIOUS DAY</text><text x="430" y="222">RECORDED</text><text x="760" y="222">UPDATED</text><text x="1070" y="222">CALCULATED</text><text x="48" y="304">DATE FILTER</text><text x="430" y="304">30-DAY VIEW</text><text x="760" y="304">HISTORY</text><text x="1070" y="304">AVAILABLE</text></g></g></svg>